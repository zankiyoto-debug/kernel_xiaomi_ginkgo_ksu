# ==============================================================================
# GINKGO BRUTAL CLOUD KERNEL BUILDER v4.1 (FlopKernel floppy-unity + FlashHouseLab Proven Recipe)
# Target  : Xiaomi Redmi Note 8 / 8T (ginkgo / willow - Snapdragon 665 SM6125)
# OS      : Project Infinity X v3.12 Android 16 (SDK 36 / Linux 4.14.357+ OpenELA)
# Base    : FlopKernel-Series/flop_trinket-mi_kernel (branch: floppy-unity)
# Root    : KernelSU-Next v3.4.0-legacy (33294) — FULL git clone + KSU_MANUAL_HOOK=y + KPROBES=n
# Compiler: AOSP Clang 20.0.0 (r547379) + GCC ARM32 4.9 (vdso32)
#
# Perbaikan v4.1:
#   - Default kernel_source_repo LANGSUNG ke FlopKernel-Series/flop_trinket-mi_kernel (floppy-unity)
#     agar tidak pernah salah meng-compile repo fork lama (LineageOS/Cuh-Kernel) yang tidak punya manual hook!
#   - Verification Gate baru: wajib cek keberadaan manual hook `ksu_handle_execveat` di fs/
#     dan status CONFIG_KSU_NEXT=y sebelum compile!
#   - Auto-handle Kconfig choice (matikan CONFIG_KSU_NONE jika ada) + opsi ThinLTO
#   - AnyKernel3 ZIP standar osm0sis (`rm -rf .git` + `zip -r9 -n .gz:.gz-dtb`) agar 100% lolos TWRP/OrangeFox
# ==============================================================================
name: Build Ginkgo Android 16 Brutal Kernel (v4.1 FlopUnity + KSUN 3.4.0)
on:
  workflow_dispatch:
    inputs:
      kernel_source_repo:
        description: "Repo kernel (WAJIB FlopKernel-Series/flop_trinket-mi_kernel untuk Android 16 + Manual Hook!)"
        required: true
        default: "FlopKernel-Series/flop_trinket-mi_kernel"
      kernel_source_branch:
        description: "Branch kernel (default: floppy-unity)"
        required: true
        default: "floppy-unity"
      defconfig_mode:
        description: "Sumber Defconfig (floppy-auto = optimal FlopKernel; infinityx-stock-file = pakai dump /proc/config.gz)"
        type: choice
        required: true
        default: "floppy-auto"
        options:
          - floppy-auto
          - infinityx-stock-file
          - custom
      custom_defconfig:
        description: "Nama defconfig manual (hanya jika defconfig_mode = custom)"
        required: false
        default: ""
      ksu_mode:
