# ==============================================================================
# GINKGO BRUTAL KERNEL BUILDER v5.0 (Clean Rewrite — Zero-Error Edition)
# Target  : Redmi Note 8 / 8T (ginkgo / willow - SM6125) | Android 16 (SDK 36)
# Source  : FlopKernel-Series/flop_trinket-mi_kernel (branch: floppy-unity)
# Root    : KernelSU-Next v3.4.0-legacy (33294, FULL clone, Manual Hook, KPROBES=n)
# Compiler: AOSP Clang 20.0.0 (r547379) + GCC ARM32 4.9 (vdso32)
# ==============================================================================

name: Build Ginkgo Brutal Kernel v5.0

on:
  workflow_dispatch:
    inputs:
      kernel_hz:
        description: "Kernel Tick Rate (250 = rekomendasi FlopKernel; 300 = ekstrem; 100 = stock)"
        type: choice
        required: true
        default: "250"
        options: ["250", "300", "100"]
      gpu_oc_profile:
        description: "GPU Adreno 610 (Build #1 pilih stock-950 dulu; Build #2 pilih oc-1050-uv / oc-1100-uv)"
        type: choice
        required: true
        default: "stock-950"
        options: ["stock-950", "oc-1050-uv", "oc-1100-uv"]
      tianma_display_hz:
        description: "Display OC Panel Tianma NT36672A (Build #1 pilih 60; Build #2 pilih 65 atau maks 66)"
        type: choice
        required: true
        default: "60"
        options: ["60", "65", "66"]
      enable_thinlto:
        description: "Aktifkan LLVM ThinLTO (opsional; build pertama lebih lama)"
        type: boolean
        default: false
      localversion:
        description: "LOCALVERSION (biarkan default agar vermagic modul 100% cocok Infinity X 3.12)"
        required: true
        default: "-openela-perf-g44758a7220f2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: "[1/8] Install Dependensi & Bebaskan Disk"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler dwarves \
            file flex git kmod gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libncurses-dev libssl-dev lld llvm python3 python-is-python3 \
            tar u-boot-tools xz-utils zip zstd

      - name: "[2/8] Setup ccache"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ginkgo-v5-${{ inputs.enable_thinlto }}-${{ github.run_id }}
          restore-keys: |
            ccache-ginkgo-v5-${{ inputs.enable_thinlto }}-
            ccache-ginkgo-v5-

      - name: "[3/8] Download Source FlopKernel (floppy-unity), Clang 20 r547379 & GCC ARM32 4.9"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/clang" "$HOME/tools"

          # Clone langsung FlopKernel floppy-unity (anti salah repo & anti error token!)
          git clone --depth=1 --branch floppy-unity \
            https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git "$GITHUB_WORKSPACE/kernel"
          sed -n '1,6p' "$GITHUB_WORKSPACE/kernel/Makefile"

          # AOSP Clang 20.0.0 (r547379) — identik dengan kernel jalan di HP-mu
          URL1="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          URL2="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r547379.tar.gz"
          curl -fL --retry 3 --retry-delay 5 "$URL1" -o /tmp/clang.tar.gz || \
            curl -fL --retry 3 --retry-delay 5 "$URL2" -o /tmp/clang.tar.gz
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          "$HOME/clang/bin/clang" --version

          # GCC ARM32 4.9 khusus vdso32 Linux 4.14
          if git clone --depth=1 https://github.com/KudProject/arm-linux-androideabi-4.9.git "$HOME/gcc32"; then
            echo "ARM32_PREFIX=$HOME/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"
            "$HOME/gcc32/bin/arm-linux-androideabi-gcc" --version | sed -n '1p'
          else
            echo "ARM32_PREFIX=arm-linux-gnueabi-" >> "$GITHUB_ENV"
          fi

          curl -fL --retry 3 \
            "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
            | base64 -d > "$HOME/tools/mkdtboimg.py"
          chmod +x "$HOME/tools/mkdtboimg.py"

      - name: "[4/8] Integrasi KernelSU-Next v3.4.0-legacy (Full Git = 33294) & 3 Patch Wajib"
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          KSUN="$HOME/KernelSU-Next"
          # WAJIB FULL CLONE (tanpa --depth=1) agar versi terhitung 33294!
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git "$KSUN"
          git -C "$KSUN" checkout v3.4.0-legacy
          echo "KSUN commit count: $(git -C "$KSUN" rev-list --count HEAD)"

          # Deteksi subdir KSU_NEXT di drivers/Makefile FlopKernel
          KSU_DIR=$(python3 - <<'PY'
          import re
          from pathlib import Path
          mk = Path("drivers/Makefile").read_text(errors="ignore")
          m = re.search(r'obj-\$\(CONFIG_KSU_NEXT\)\s*\+=\s*([A-Za-z0-9_.-]+)/', mk) or \
              re.search(r'obj-\$\(CONFIG_KSU\)\s*\+=\s*([A-Za-z0-9_.-]+)/', mk)
          print(m.group(1) if m else "kernelsu")
          PY
          )
          echo "Target KSU subdir: drivers/$KSU_DIR"
          rm -rf "drivers/$KSU_DIR"
          ln -s "$KSUN/kernel" "drivers/$KSU_DIR"

          if ! grep -qE "obj-\\\$\(CONFIG_KSU(_NEXT)?\).*${KSU_DIR}/" drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += %s/\n' "$KSU_DIR" >> drivers/Makefile
          fi
          if ! grep -rq "drivers/${KSU_DIR}/Kconfig" Kconfig drivers/ init/ security/ 2>/dev/null; then
            python3 - "$KSU_DIR" <<'PY'
          import sys
          from pathlib import Path
          p = Path("drivers/Kconfig")
          txt = p.read_text()
          line = f'source "drivers/{sys.argv[1]}/Kconfig"\n'
          i = txt.rfind("endmenu")
          p.write_text((txt[:i] + line + txt[i:]) if i != -1 else (txt + "\n" + line))
          PY
          fi

          # Patch #1: sulog/event.c (Linux < 4.19)
          [ -f "$KSUN/kernel/sulog/event.c" ] && \
            sed -i 's/\bget_monotonic_boottime(/get_monotonic_boottime64(/g' "$KSUN/kernel/sulog/event.c"

          # Patch #2: fs/proc/cmdline.c (Clang 20)
          if [ -f "fs/proc/cmdline.c" ] && ! grep -q "<asm/setup.h>" fs/proc/cmdline.c; then
            sed -i '0,/^#include <linux\/.*>$/s//&\n#include <asm\/setup.h>/' fs/proc/cmdline.c
          fi

          # Patch #3: include/linux/battery_saver.h (Clang 20 strict-prototypes)
          if [ -f "include/linux/battery_saver.h" ]; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("include/linux/battery_saver.h")
          t = p.read_text()
          n = re.sub(r'(\b(?:static\s+inline|inline|extern|void|bool|int|unsigned\s+\w+)\s+[A-Za-z_][A-Za-z0-9_*\s]*?\b[A-Za-z_][A-Za-z0-9_]*)\s*\(\s*\)', r'\1(void)', t)
          if n != t:
              p.write_text(n)
          PY
          fi

      - name: "[5/8] Opsional: Patch GPU Adreno 610 OC+UV & Tianma Display OC"
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          GPU="${{ inputs.gpu_oc_profile }}"
          HZ="${{ inputs.tianma_display_hz }}"

          if [ "$GPU" != "stock-950" ]; then
            python3 - "$GPU" <<'PY'
          import re, sys
          from pathlib import Path

          prof = sys.argv[1]
          max_f = 1050000000 if prof == "oc-1050-uv" else 1100000000

          gpucc = Path("drivers/clk/qcom/gpucc-trinket.c")
          src = gpucc.read_text()
          def add_ftbl(m):
              b = m.group(0)
              ins = "\tF(1050000000, P_GPU_CC_PLL0_OUT_AUX2, 1, 0, 0),\n"
              if max_f >= 1100000000:
                  ins += "\tF(1100000000, P_GPU_CC_PLL0_OUT_AUX2, 1, 0, 0),\n"
              if "1050000000" not in b:
                  b, c = re.subn(r'([ \t]*F\(950000000,[^\n]+\n)', r'\1' + ins, b, count=1)
                  assert c == 1, "950MHz tidak ditemukan di ftbl"
              return b
          src, n1 = re.subn(r'static const struct freq_tbl ftbl_gpu_cc_gx_gfx3d_clk_src\[\]\s*=\s*\{.*?\};', add_ftbl, src, count=1, flags=re.S)
          assert n1 == 1, "ftbl_gpu_cc_gx_gfx3d_clk_src tidak ditemukan"

          def fix_rcg(m):
              b = re.sub(r'(\[VDD_NOMINAL_L1\]\s*=\s*)\d+', r'\g<1>950000000', m.group(0))
              b, c = re.subn(r'(\[VDD_HIGH\]\s*=\s*)\d+', rf'\g<1>{max_f}', b)
              assert c >= 1, "VDD_HIGH tidak ditemukan"
              return b
          src, n2 = re.subn(r'static struct clk_rcg2 gpu_cc_gx_gfx3d_clk_src\s*=\s*\{.*?\n\};', fix_rcg, src, count=1, flags=re.S)
          assert n2 == 1, "gpu_cc_gx_gfx3d_clk_src tidak ditemukan"
          gpucc.write_text(src)

          freqs = [1050000000, 950000000, 820000000, 745000000, 600000000, 465000000, 320000000] if prof == "oc-1050-uv" \
             else [1100000000, 1050000000, 950000000, 820000000, 745000000, 600000000, 465000000]

          def patch_blk(blk):
              if "950000000" not in blk:
                  return blk, False
              ok = False
              for i, f in enumerate(freqs):
                  blk, c = re.subn(rf'(qcom,gpu-pwrlevel-{i}\s*\{{[^}}]*?qcom,gpu-freq\s*=\s*<)\d+(>;)', rf'\g<1>{f}\g<2>', blk, count=1, flags=re.S)
                  ok = ok or bool(c)
                  if f >= 1050000000:
                      blk = re.sub(rf'qcom,gpu-pwrlevel-{i}\s*\{{[^}}]*?\}};',
                          lambda pm: re.sub(r'(qcom,bus-(?:freq|min|max)\s*=\s*<)\d+(>;)', r'\g<1>11\g<2>', pm.group(0)),
                          blk, count=1, flags=re.S)
              return blk, ok

          patched = 0
          for dts in sorted(Path("arch/arm64/boot/dts").rglob("*.dts*")):
              t = dts.read_text(errors="ignore")
              if "qcom,gpu-pwrlevel-0" not in t or "950000000" not in t:
                  continue
              t = re.sub(r'^([ \t]*)(qcom,gpu-gaming-bin;)', r'\1/* \2 */', t, flags=re.M)
              out, pos, any_ok = [], 0, False
              for m in re.finditer(r'qcom,gpu-pwrlevels(?:-\d+)?\s*\{', t):
                  if m.start() < pos:
                      continue
                  s = t.find("{", m.start())
                  d, e = 0, s
                  while e < len(t):
                      d += (t[e] == "{") - (t[e] == "}")
                      e += 1
                      if d == 0:
                          if e < len(t) and t[e] == ";":
                              e += 1
                          break
                  out.append(t[pos:m.start()])
                  nb, ok = patch_blk(t[m.start():e])
                  any_ok = any_ok or ok
                  out.append(nb)
                  pos = e
              out.append(t[pos:])
              if any_ok:
                  dts.write_text("".join(out))
                  patched += 1
          assert patched > 0, "trinket-gpu.dtsi tidak ter-patch!"
          PY
          fi

          if [ "$HZ" != "60" ]; then
            python3 - "$HZ" <<'PY'
          import re, sys
          from pathlib import Path
          hz = int(sys.argv[1])
          cnt = 0
          for f in sorted(Path("arch/arm64/boot/dts").rglob("*.dts*")):
              t = f.read_text(errors="ignore")
              if (("nt36672a" in f.name.lower() and "tianma" in f.name.lower()) or "dsi_nt36672a_tianma_vid" in t) \
                 and "qcom,mdss-dsi-panel-framerate" in t:
                  nt = re.sub(r'(qcom,mdss-dsi-panel-framerate\s*=\s*<)60(>;)', rf'\g<1>{hz}\g<2>', t)
                  nt = re.sub(r'(qcom,mdss-dsi-(?:panel-clockrate|bitclock-frequency)\s*=\s*<)(\d+)(>;)',
                      lambda m: f"{m.group(1)}{int(round(int(m.group(2)) * hz / 60.0))}{m.group(3)}" if int(m.group(2)) > 0 else m.group(0), nt)
                  if nt != t:
                      f.write_text(nt)
                      cnt += 1
          assert cnt > 0, "Panel Tianma NT36672A tidak ditemukan!"
          PY
          fi
          git diff --stat || true

      - name: "[6/8] Konfigurasi Defconfig Ginkgo + Flag Resep Terbukti"
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"

          # Auto-deteksi defconfig FlopKernel untuk ginkgo
          CFG_LIST=""
          if [ -f "arch/arm64/configs/vendor/trinket-perf_defconfig" ] && [ -f "arch/arm64/configs/vendor/ginkgo.config" ]; then
            CFG_LIST="vendor/trinket-perf_defconfig"
            [ -f "arch/arm64/configs/vendor/xiaomi-trinket.config" ] && CFG_LIST="$CFG_LIST vendor/xiaomi-trinket.config"
            [ -f "arch/arm64/configs/vendor/floppy.config" ] && CFG_LIST="$CFG_LIST vendor/floppy.config"
            CFG_LIST="$CFG_LIST vendor/ginkgo.config"
          else
            for c in vendor/ginkgo-perf_defconfig vendor/ginkgo_defconfig ginkgo-perf_defconfig ginkgo_defconfig vendor/trinket-perf_defconfig; do
              [ -f "arch/arm64/configs/$c" ] && { CFG_LIST="$c"; break; }
            done
          fi
          echo "Defconfig sources: $CFG_LIST"
          : > arch/arm64/configs/ginkgo_brutal_defconfig
          for c in $CFG_LIST; do
            cat "arch/arm64/configs/$c" >> arch/arm64/configs/ginkgo_brutal_defconfig
            echo "" >> arch/arm64/configs/ginkgo_brutal_defconfig
          done

          MAKE_ARGS=(
            O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            DTC_EXT="$(which dtc)"
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32="$ARM32_PREFIX" CROSS_COMPILE_COMPAT="$ARM32_PREFIX"
          )
          make "${MAKE_ARGS[@]}" ginkgo_brutal_defconfig

          SC="scripts/config --file out/.config"
          $SC --set-str CONFIG_LOCALVERSION "${{ inputs.localversion }}"
          $SC --disable CONFIG_LOCALVERSION_AUTO
          $SC --disable CONFIG_MODULE_SIG_FORCE
          $SC --enable CONFIG_MODVERSIONS
          $SC --enable CONFIG_IKCONFIG --enable CONFIG_IKCONFIG_PROC

          # KernelSU-Next Manual Hook (WAJIB KPROBES=n!)
          $SC --disable CONFIG_KSU_NONE --disable CONFIG_KSU_SUKI --disable CONFIG_KSU_XXKSU --disable CONFIG_KSU_BAKASU
          $SC --enable CONFIG_KSU --enable CONFIG_KSU_NEXT --enable CONFIG_KSU_MANUAL_HOOK
          $SC --disable CONFIG_KPROBES --disable CONFIG_KPROBE_EVENTS --enable CONFIG_OVERLAY_FS

          # Tick Rate (100 / 250 / 300 Hz)
          $SC --disable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_300 --disable CONFIG_HZ_1000
          $SC --enable "CONFIG_HZ_${{ inputs.kernel_hz }}"

          # Performa Brutal Creator (BBR/BBR2 + FQ + LZ4 ZRAM + BORE/MGLRU jika ada)
          $SC --enable CONFIG_TCP_CONG_ADVANCED --enable CONFIG_TCP_CONG_BBR --enable CONFIG_DEFAULT_BBR
          $SC --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          $SC --enable CONFIG_NET_SCH_FQ --enable CONFIG_NET_SCH_FQ_CODEL
          $SC --enable CONFIG_ZRAM --enable CONFIG_CRYPTO_LZ4 --enable CONFIG_ZRAM_WRITEBACK
          grep -rq "config TCP_CONG_BBR2" net/ipv4/ && $SC --enable CONFIG_TCP_CONG_BBR2 || true
          grep -rq "config SCHED_BORE" kernel/sched/ init/ && $SC --enable CONFIG_SCHED_BORE || true
          grep -rq "config LRU_GEN" mm/ && $SC --enable CONFIG_LRU_GEN --enable CONFIG_LRU_GEN_ENABLED || true

          if [ "${{ inputs.enable_thinlto }}" = "true" ]; then
            $SC --disable CONFIG_LTO_NONE --enable CONFIG_LTO --enable CONFIG_LTO_CLANG --enable CONFIG_THINLTO
          fi

          make "${MAKE_ARGS[@]}" olddefconfig
          echo "=== Verifikasi Final out/.config ==="
          grep -E 'CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES|CONFIG_HZ=|CONFIG_TCP_CONG_BBR|CONFIG_SCHED_BORE|CONFIG_LTO' out/.config || true
          grep -q "^CONFIG_KSU=y$" out/.config
          ! grep -q "^CONFIG_KPROBES=y$" out/.config

      - name: "[7/8] Compile Kernel ARM64 SM6125"
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: ginkgo-brutal
          KBUILD_BUILD_HOST: github-actions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 4G

          MAKE_ARGS=(
            O=out ARCH=arm64 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            DTC_EXT="$(which dtc)"
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32="$ARM32_PREFIX" CROSS_COMPILE_COMPAT="$ARM32_PREFIX"
          )

          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image.gz-dtb 2>&1 | tee /tmp/build.log
          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image.gz dtbs 2>&1 | tee -a /tmp/build.log || true
          make -j"$(nproc)" "${MAKE_ARGS[@]}" dtbo.img 2>&1 | tee -a /tmp/build.log || true
          grep -iE "KernelSU.*version:" /tmp/build.log | sed -n '1p' || true
          ccache -s || true

      - name: "[8/8] Kemas AnyKernel3 ZIP (Android 16) & Upload Artifact"
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          AK="$GITHUB_WORKSPACE/AnyKernel3"
          RAW="$GITHUB_WORKSPACE/raw_boot_payload"
          rm -rf "$AK" "$RAW"
          mkdir -p "$RAW"

          UPDATE_DTB=0
          if [ "${{ inputs.gpu_oc_profile }}" != "stock-950" ] || [ "${{ inputs.tianma_display_hz }}" != "60" ]; then
            UPDATE_DTB=1
          fi

          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp -f out/arch/arm64/boot/Image.gz-dtb "$RAW/"
          [ -f out/arch/arm64/boot/Image.gz ] && cp -f out/arch/arm64/boot/Image.gz "$RAW/"
          cp -f out/.config "$RAW/kernel.config"

          DTB_FILES=$(find out/arch/arm64/boot/dts -type f -name "*trinket*.dtb" | sort || true)
          [ -n "$DTB_FILES" ] && cat $DTB_FILES > "$RAW/dtb"

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp -f out/arch/arm64/boot/dtbo.img "$RAW/dtbo.img"
          else
            DTBO_FILES=$(find out/arch/arm64/boot/dts -type f \( -name "*ginkgo*overlay*.dtbo" -o -name "*trinket*overlay*.dtbo" \) | sort || true)
            [ -n "$DTBO_FILES" ] && python3 "$HOME/tools/mkdtboimg.py" create "$RAW/dtbo.img" --page_size=4096 $DTBO_FILES
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK"
          rm -rf "$AK/.git" "$AK/README.md"
          mkdir -p "$AK/payload"
          cp -f "$RAW"/Image* "$AK/payload/" 2>/dev/null || true
          [ -f "$RAW/dtb" ] && cp -f "$RAW/dtb" "$AK/payload/"
          [ -f "$RAW/dtbo.img" ] && cp -f "$RAW/dtbo.img" "$AK/payload/"

          cat <<EOF > "$AK/anykernel.sh"
          properties() { '
          kernel.string=Ginkgo Brutal FlopUnity (${{ inputs.gpu_oc_profile }} | ${{ inputs.tianma_display_hz }}Hz | HZ=${{ inputs.kernel_hz }})
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ginkgo
          device.name2=willow
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          split_boot;

          UPDATE_DTB=${UPDATE_DTB}
          if [ -f "\$split_img/dtb" ] || [ -f "\$split_img/kernel_dtb" ]; then
            if [ -f "\$home/payload/Image.gz" ]; then
              cp -f "\$home/payload/Image.gz" "\$home/Image.gz";
            else
              cp -f "\$home/payload/Image.gz-dtb" "\$home/Image.gz-dtb";
            fi;
            if [ "\$UPDATE_DTB" = "1" ]; then
              [ -f "\$home/payload/dtb" ] && cp -f "\$home/payload/dtb" "\$home/dtb";
              [ -f "\$home/payload/dtbo.img" ] && cp -f "\$home/payload/dtbo.img" "\$home/dtbo.img";
            fi;
          else
            cp -f "\$home/payload/Image.gz-dtb" "\$home/Image.gz-dtb";
            [ "\$UPDATE_DTB" = "1" ] && [ -f "\$home/payload/dtbo.img" ] && cp -f "\$home/payload/dtbo.img" "\$home/dtbo.img";
          fi;

          flash_boot;
          EOF

          ZIP_NAME="GinkgoBrutal-v5-${{ inputs.gpu_oc_profile }}-${{ inputs.tianma_display_hz }}Hz-HZ${{ inputs.kernel_hz }}-$(date +%Y%m%d-%H%M).zip"
          (cd "$AK" && zip -r9 -n .gz:.gz-dtb "$GITHUB_WORKSPACE/$ZIP_NAME" * -x '*placeholder')
          python3 -m zipfile -t "$GITHUB_WORKSPACE/$ZIP_NAME"
          sha256sum "$GITHUB_WORKSPACE/$ZIP_NAME" | tee "$GITHUB_WORKSPACE/${ZIP_NAME}.sha256"

      - name: Upload Artifact (EKSTRAK 1x DULU SEBELUM FLASH!)
        uses: actions/upload-artifact@v4
        with:
          name: EKSTRAK-DULU-GinkgoBrutal-${{ inputs.gpu_oc_profile }}-${{ inputs.tianma_display_hz }}Hz
          path: |
            GinkgoBrutal-v5-*.zip
            GinkgoBrutal-v5-*.zip.sha256
            raw_boot_payload/
          retention-days: 30
